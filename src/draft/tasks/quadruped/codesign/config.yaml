# Optimized geometry is an opt-in special case of the quadruped task.
task: quadruped
run_name: quadruped_codesign
logger: tensorboard
seed: 0
device: cuda

n_envs: 512
max_episode_length: 20.0
max_iterations: 1000
save_interval: 25
env_kwargs:
  robot_xml: generated/cheetah/quadruped.xml
  hardware_aware: true

# Fixed/randomized conditioning retain native PPO.
# Optimize alternates native controller PPO with frozen full-trial hardware PPO.
# Set training_schedule: coadaptation to score the same controller-training
# trajectories instead. Do not set hardware_evaluation_steps/hardware_bootstrap
# in that mode; eval_interval still runs independent frozen validation trials.
# Co-adaptation keeps worlds across update windows for at least one full native
# episode (rounded up to a complete window). 'window' restores per-window rebuilds.
# Hardware gamma is independent of the controller PPO discount.
codesign:
  mode: optimize
  training_schedule: alternating
  coadaptation_cohort_lifetime: episode
  hardware_gamma: 1.0
  staleness_diagnostics: true
  staleness_probe_samples_per_design: 64
  controller_updates_per_cycle: 20
  controller_schedule: adaptive
  num_designs: 16
  replicas: 32
  compiler_workers: 0
  max_cache_entries: 128
  cache_dir: generated/codesign
  geometry_relative_range: 0.15
  optimize_hardware: true
  hardware_std: 0.5
  hardware_loss_weight: 1.0
  hardware_target_kl: 0.02
  hardware_update_schedule: once_per_epoch
  terminal_penalty: -10.0
  invalid_design_return: -1000.0
  eval_interval: 25
  eval_replicas: 16
